name: Gold historical application acceptance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        jdk: [17, 21]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify structural source gate
        run: ./verify-course-source.sh
      - name: Verify four historical applications and learner boundaries
        env:
          TASK_JDK: ${{ matrix.jdk }}
        run: |
          task_java_home_name="JAVA_HOME_${TASK_JDK}_X64"
          task_java_home="${!task_java_home_name}"
          "$task_java_home/bin/java" -version
          python3 tests/verify-historical-algorithm-packs.py --javac "$task_java_home/bin/javac" --java "$task_java_home/bin/java"
